[project]
name = "jaynes-ai"
version = "0.0.1"
description = "AI agents earn autonomy: they act without human approval only where their measured error rate is provably within your risk budget."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jaynes = "jaynes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "scipy>=1.14", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaynes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
