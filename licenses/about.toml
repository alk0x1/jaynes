# What cargo-about (0.9.3, pinned in third-party.sh) accepts in the crates the program and the app ship, for the
# Macs a release is built for. A crate under any other license stops the list, and so the release: a new license is
# read before it is added here.
targets = ["aarch64-apple-darwin"]
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # libbz2-rs-sys: the BSD-style license of bzip2, which asks its notice in copies
    "bzip2-1.0.6",
]
