name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # the engine on macOS, with the proved model in Lean
    runs-on: macos-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.elan
            engine/target
            engine/model/.lake
          key: engine-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'engine/model/lean-toolchain', 'engine/model/lake-manifest.json') }}
      # Lean, so the test that compares the core with the proved model runs instead of being skipped
      - name: Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # the photographs take a test browser, pinned, and never a Chrome of the machine's own
      - name: A test browser
        run: |
          npx -y playwright@1.50.1 install chromium-headless-shell
          # this Playwright keeps the shell at chrome-mac/headless_shell; later ones at chrome-headless-shell-mac-*/
          shell=$(ls -d ~/Library/Caches/ms-playwright/chromium_headless_shell-*/chrome-mac/headless_shell \
            ~/Library/Caches/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-mac-*/chrome-headless-shell 2>/dev/null | head -1)
          test -x "$shell"
          echo "JAYNES_CHROME=$shell" >> "$GITHUB_ENV"
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        env:
          JAYNES_REQUIRE_LEAN: "1"
          # the next step proves the Lean model against the records the end-to-end runs leave
          JAYNES_KEEP_TEST_RUNS: "1"
      # the model against every state of the records the end-to-end tests just made with real roles
      - name: Lean model against real records
        env:
          JAYNES_REQUIRE_LEAN: "1"
        run: |
          JAYNES_MODEL_RECORD=$(ls -d "${TMPDIR:-/tmp}"/jaynes-e2e-*/home/record.sqlite3 | tr '\n' ':') \
            cargo test --locked -p jaynes-core --test guarantees the_lean_model -- --nocapture

  linux:
    # the engine on Linux, where the box is the kernel's Landlock and a seccomp filter; the hosted runner is the
    # one Linux these tests run on, so its kernel, and which way the box holds Unix sockets on it, are printed
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-linux-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
      - name: The machine
        run: |
          uname -srm
          echo "unprivileged user namespaces restricted by AppArmor: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo unknown)"
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked -p jaynes-shell
      - name: The box on this kernel
        run: target/debug/jaynes box --check
      - run: cargo test --locked
      # a process 1 that collects nobody, as in a container run without --init: an agent that ended and waits to be
      # collected must not count as running
      - name: The shell's own tests in a container without init
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/engine -e CARGO_TARGET_DIR=/tmp/target rust:1-bookworm cargo test --locked -p jaynes-shell --lib
