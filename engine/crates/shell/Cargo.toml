[package]
name = "jaynes-shell"
description = "The shell around the core: the record in SQLite, the role's process, the agent program, the command line."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jaynes_shell"
path = "src/lib.rs"

[[bin]]
name = "jaynes"
path = "src/main.rs"

[dependencies]
jaynes-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite.workspace = true
schemars.workspace = true
toml = { version = "0.9", features = ["preserve_order"] }
ed25519-dalek = "2"

[dev-dependencies]
p256.workspace = true

[lints]
workspace = true
