[package]
name = "jaynes-shell"
description = "The shell around the core: the record in SQLite, the role's process, the agent program, the command line."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jaynes_shell"
path = "src/lib.rs"

[[bin]]
name = "jaynes"
path = "src/main.rs"

[dependencies]
jaynes-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite.workspace = true
schemars.workspace = true
toml = { version = "0.9", features = ["preserve_order"] }
ed25519-dalek = "2"
# signals to a process group straight from the program, so no kill program on the machine is needed
rustix = { version = "1", features = ["process"] }

# the box on Linux: the kernel's Landlock and a seccomp filter, set by the program on itself
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[lints]
workspace = true
