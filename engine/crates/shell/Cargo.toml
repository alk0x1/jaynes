[package]
name = "jaynes-shell"
description = "The shell around the core: the record in SQLite, the role's process, the agent program, the command line."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jaynes_shell"
path = "src/lib.rs"

[[bin]]
name = "jaynes"
path = "src/main.rs"

[features]
# A test build: the model's host of an agent program is sent to an address the test names (JAYNES_TEST_MODEL_AT).
# Never in a build for people, which refuses to run an agent with that variable set.
test-model-host = []

[dependencies]
jaynes-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite.workspace = true
schemars.workspace = true
toml = { version = "0.9", features = ["preserve_order"] }
ed25519-dalek = "2"

[lints]
workspace = true
