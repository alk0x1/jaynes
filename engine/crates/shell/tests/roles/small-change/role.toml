# small-change: the agent makes a small change and Jaynes runs the project's suite, with no stop. When the rules
# in code find the change is not small (more lines or files than a small one, or a file that runs later outside
# any box), the run's risk goes up and the person sees the change.

role = "small-change"
version = "4.0.0"

[[step]]
name = "runner"
by = "jaynes"
use = "find-suite"

[[step]]
name = "change"
needs = ["runner"]
reach = { project = "write", write = ["**"], commands = true }
about = "Makes the change."
instructions = """
The task is a small change the person agreed on. Make it in this folder, which is a copy of the project, keeping
it as small as the task needs.

The command that runs the project's whole suite, empty when it has none: {{runner.suite}}

In summary, say what changed as the person will see it, in plain words: no code, no file names; they see the
change itself beside it.

Run it yourself before you answer. Jaynes runs it again without internet and requires it to pass. Do not commit;
Jaynes does.
"""
checks = [
  { use = "field-required", field = "summary" },
  { use = "field-max-length", field = "summary", max = 400 },
  { use = "plain-words", field = "summary" },
  "suite-passes",
]
# One question, when the change turned out not small; the person reads what changed in a sentence, and sees the
# change itself beside it.
stop = { ask = "{{risk}} Keep it, or have it done again?", verdicts = ["keep", "redo"], from_risk = "high", release = true, answers = { keep = "Keep it", redo = "Do it again" } }
show = { label = "{{summary}}" }

[step.output]
summary = { type = "string", about = "what changed, as the person will see it, in a sentence or two of plain words: no code, no file names" }
files = { type = "array", items = "string" }

[[promise]]
says = "Nothing is delivered before the project's suite passed on the change"
never = "deliver"
unless = "check suite-passes of change passed"

# What a run delivers, and what proves it in that run: `jaynes check` lists each claim with what proves it in a run.
[[claim]]
says = "The project's test suite passes on the delivered change, run by Jaynes without internet, as the project defined it when the run began"
unchecked = "the suite's check also passes a project that has no suite, having run nothing, so a run cannot yet prove its suite ran; until a check can say it judged nothing, this is not proved run by run"

[[claim]]
says = "The change comes with what changed, in a sentence or two"
proved_by = "check field-required of change passed"

[[claim]]
says = "The change does what the request asked"
unchecked = "no check compares the change with the request; the person sees the change only when it turns out bigger than a small one or touches a file that runs later outside any box"
