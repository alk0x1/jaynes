# announce-version: writes the entry of the project's version in its changelog and announces that version to the
# project's registry. No agent works: each step is a script of this folder, which Jaynes runs in its box.
#
# What cannot be undone here is the announcement. What the registry then lists is read by a step of the role and
# judged by a check, which comes with cases since it judges only what was read. It starts only once every answer it rests on is the person's, and
# the registry is given the run's key, so an announcement sent twice counts once.

role = "announce-version"
version = "1.0.0"

[[step]]
name = "survey"
by = "role"
script = "steps/survey.py"
reach = { project = "read" }
about = "Reads the version the project is at and where its registry is."
checks = ["output-follows-schema"]

[step.output]
version = { type = "string", max_length = 40, about = "the version in the project's VERSION file" }
registry = { type = "string", about = "the address in the project's registry file" }

[[step]]
name = "stamp"
by = "role"
script = "steps/stamp.py"
needs = ["survey"]
reach = { project = "write", write = ["CHANGELOG.md"] }
about = "Writes the version's entry in the changelog."
checks = ["output-follows-schema", "files-within"]

[step.output]
entry = { type = "string", about = "the entry written" }
files = { type = "array", items = "string" }

[[step]]
name = "announce"
by = "role"
script = "steps/announce.py"
needs = ["survey", "stamp"]
reach = { local_ports = [18473] }
effect = "irreversible"
idempotent = true
about = "Announces the version to the registry. This cannot be undone."
checks = ["output-follows-schema"]

[step.output]
id = { type = "string", about = "the registry's id for the announcement" }

# What the registry lists is read by a step of the role and kept with when it was read; the check judges only that
# reading, so the cases it comes with can stand for any reading. The reader itself is not checked.
[[step]]
name = "read-registry"
by = "role"
script = "steps/read_registry.py"
needs = ["survey", "announce"]
reach = { local_ports = [18473] }
effect = "none"
about = "Reads what the registry lists, and when."
checks = [
  "output-follows-schema",
  { script = "checks/announced.py", kind = "open", about = "the reading of the registry lists the version under the id the announcement got" },
]

[step.output]
listed = { type = "array", about = "what the registry listed: each an id and a version" }
read_at = { type = "string", about = "when the registry was read, in UTC" }

[[promise]]
says = "Nothing is announced before the changelog has the version's entry"
event = "step announce starts"
only_after = "step stamp done"

[[claim]]
says = "The changelog has the entry of the version announced"
proved_by = "check output-follows-schema of stamp passed"

[[claim]]
says = "The registry lists the version"
proved_by = "check announced of read-registry passed"

[[claim]]
says = "The entry's words are the ones the release needs"
unchecked = "the role writes the request as it came, and no person is asked"
