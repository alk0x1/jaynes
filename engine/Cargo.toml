[workspace]
resolver = "3"
members = ["crates/core", "crates/shell"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
proptest = "1"
schemars = "1"

[workspace.lints.rust]
# deny, not forbid, for one place only: the Linux box marks the files it was handed open to close on exec
# (sandbox.rs, close_handed_open), which no safe call can name by number
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "deny"

# The guarantees' random runs are thousands of runs; the core's tests build it with optimisations.
[profile.test]
opt-level = 2
