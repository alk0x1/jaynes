<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Jaynes icon's one layer, in the app's graphite, for a light Mac: a friendly giraffe whose neck is the J. Its eye is the terminal's
       cursor; its spots are a run's steps, the amber ones the stops where Jaynes waits for the person, the green one at
       the tip the delivery. macOS draws the tile, its colour set in ../icon.json. -->
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="910"><stop offset="0" stop-color="#262a31"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient>
    <radialGradient id="stop" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffc47e"/><stop offset="1" stop-color="#ff9a2e"/></radialGradient>
  </defs>
  <g fill="url(#body)">
    <path d="M600 430V640a175 175 0 0 1-350 0" fill="none" stroke="url(#body)" stroke-width="184" stroke-linecap="round"/>
    <path d="M572 236 L556 140 M652 244 L674 152" stroke="url(#body)" stroke-width="36" stroke-linecap="round"/>
    <circle cx="555" cy="132" r="34"/><circle cx="675" cy="144" r="34"/>
    <ellipse cx="768" cy="262" rx="74" ry="34" transform="rotate(-24 768 262)"/>
    <ellipse cx="572" cy="328" rx="178" ry="124" transform="rotate(-6 572 328)"/>
    <circle cx="418" cy="372" r="100"/>
  </g>
  <ellipse cx="404" cy="388" rx="78" ry="62" fill="#2e333b"/>
  <circle cx="372" cy="362" r="10" fill="#8b909b"/>
  <path d="M368 418 Q404 446 446 420" fill="none" stroke="#8b909b" stroke-width="11" stroke-linecap="round"/>
  <circle cx="618" cy="310" r="48" fill="#e9ecf1"/>
  <path d="M602 290 L632 310 L602 330" fill="none" stroke="#131519" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="578" cy="470" rx="26" ry="20" transform="rotate(-20 578 470)" fill="#363b45"/><ellipse cx="604" cy="556" rx="40" ry="36" transform="rotate(10 604 556)" fill="url(#stop)"/><ellipse cx="624" cy="650" rx="24" ry="19" transform="rotate(25 624 650)" fill="#363b45"/><ellipse cx="559" cy="752" rx="25" ry="20" transform="rotate(-35 559 752)" fill="#363b45"/><ellipse cx="425" cy="815" rx="40" ry="36" transform="rotate(0 425 815)" fill="url(#stop)"/><ellipse cx="301" cy="764" rx="24" ry="19" transform="rotate(40 301 764)" fill="#363b45"/><ellipse cx="254" cy="612" rx="30" ry="28" transform="rotate(0 254 612)" fill="#69dba0"/>
